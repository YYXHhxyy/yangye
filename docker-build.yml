name: Build and Push ARM64 Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-gxc7esfc8xxi4evs.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            crpi-gxc7esfc8xxi4evs.cn-hangzhou.personal.cr.aliyuncs.com/hd_yangye/tianzhibei:arm64-v0.1
            crpi-gxc7esfc8xxi4evs.cn-hangzhou.personal.cr.aliyuncs.com/hd_yangye/tianzhibei:latest
